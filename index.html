<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PipQuest</title>
    <style>
        body { margin: 0; background: #f5da9e; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; background: #f5da9e; width: 100vw; height: auto; }
        #desktop-msg { display: none; position: absolute; font-family: sans-serif; font-size: 24px; color: #333; }
    </style>
</head>
<body>
    <div id="desktop-msg">📱 Пожалуйста, используйте смартфон!</div>
    <canvas id="game" width="640" height="360"></canvas>
    <script>
        // Детектор мобильных устройств
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (!isMobile) {
            document.getElementById('game').style.display = 'none';
            document.getElementById('desktop-msg').style.display = 'block';
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
